name: Le Benjamin Booking Monitor

on:
  schedule:
    # Every 15 minutes (UTC)
    - cron: '*/15 * * * *'
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email only (skip availability check)'
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit gastro_state.json back to repo

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            httr2
            jsonlite

      - name: Check availability and send notifications
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: Rscript gastro_monitor.R

      - name: Commit updated state
        if: inputs.test_email != true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ ! -f gastro_state.json ]; then
            echo "::error::gastro_state.json was not created. Check that gastro_monitor.R exists in the repo root and contains the full script (not an empty file)."
            exit 1
          fi
          git add gastro_state.json
          # Only commit if state file actually changed
          if git diff --quiet --staged; then
            echo "No changes to gastro_state.json — skipping commit."
            exit 0
          fi
          git commit -m "Update Le Benjamin availability state [skip ci]"
          # Retry push: the DNT workflow may push at the same time
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              echo "State pushed."
              exit 0
            fi
            echo "Push attempt $i failed — retrying in 10s..."
            sleep 10
          done
          echo "::warning::Could not push state after 3 attempts. Next run will retry — no action needed."
          exit 0
