name: DNT Cabin Monitor

on:
  schedule:
    # Bootstrap every 2 hours. Each run then polls internally every
    # 15 min for up to 5.5 h. (GitHub throttles high-frequency cron
    # schedules on free accounts — the in-run loop keeps the true
    # 15-min polling interval regardless of scheduler delays.)
    - cron: '0 */2 * * *'
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email only (skip polling)'
        type: boolean
        default: false

concurrency:
  group: dnt-monitor
  cancel-in-progress: true   # a new run replaces the previous loop

permissions:
  contents: write  # needed to commit state.json back to repo

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # GitHub-hosted job limit is 6 h

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history so pull --rebase always works

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            httr2
            jsonlite

      - name: Send test email
        if: inputs.test_email == true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          TEST_EMAIL: 'true'
        run: Rscript monitor.R

      - name: Poll availability (15-min checks for up to 5.5 h)
        if: inputs.test_email != true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          deadline=$(( $(date +%s) + 330 * 60 ))
          n=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$((n+1))
            echo "=== Check #$n — $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            Rscript monitor.R

            # Commit state immediately whenever it changed
            git add state.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Update availability state [skip ci]" || true
              pushed=0
              for i in 1 2 3; do
                if git pull --rebase && git push; then pushed=1; break; fi
                echo "Push attempt $i failed — retrying in 10s..."
                sleep 10
              done
              if [ "$pushed" -ne 1 ]; then
                echo "::error::Could not push state after 3 attempts."
                exit 1
              fi
            fi

            sleep 900   # 15 minutes
          done
          echo "Polling budget reached — run complete."
